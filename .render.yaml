services:
  - type: web
    name: acidentes-pe
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "sh -c 'python -m gunicorn server:app --bind 0.0.0.0:${PORT:-8000}'"
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        value: "saude.pe.gov.br"
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: POSTGRES_TABLE
        value: "public.acidentes"
      - key: POSTGRES_BOOTSTRAP_LOCAL
        value: "true"
      - key: DATA_DIR
        value: /var/data
      - key: REQUIRE_PERSISTENT_STORAGE
        value: "true"
    disk:
      name: acidentes-pe-data
      mountPath: /var/data
      sizeGB: 1
