name: Dump automático ObservaTrafego

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar dump do dia
        run: |
          DAY="$(TZ=America/Recife date +%F)"
          python scripts/backup_observatrafego_to_sql.py \
            --url "https://observatrafego.saude.pe.gov.br/api/accidents" \
            --day "$DAY" \
            --output "dumps/observatrafego/observatrafego_${DAY}.sql"
          cp "dumps/observatrafego/observatrafego_${DAY}.sql" \
             "dumps/observatrafego/observatrafego_latest.sql"

      - name: Commit somente se houver alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dumps/observatrafego/*.sql
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos registros do dia."
            exit 0
          fi
          git commit -m "chore: atualiza dump ObservaTrafego $(TZ=America/Recife date +%F)"
          git push
