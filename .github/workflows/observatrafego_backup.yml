name: Dump automático ObservaTrafego

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/observatrafego_backup.yml"
      - "scripts/backup_observatrafego_to_sql.py"

permissions:
  contents: write

env:
  # O domínio institucional pode falhar para runners externos por DNS/rede.
  # Mantemos o domínio do app como segunda rota pública de coleta.
  OBSERVATRAFEGO_API_PRIMARY: "https://observatrafego.saude.pe.gov.br/api/accidents"
  OBSERVATRAFEGO_API_FALLBACK: "https://observatrafego-jx4p.onrender.com/api/accidents"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar endpoint e gerar dump do dia
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=America/Recife date +%F)"
          OUTPUT="dumps/observatrafego/observatrafego_${DAY}.sql"
          URL=""

          for CANDIDATE in "$OBSERVATRAFEGO_API_PRIMARY" "$OBSERVATRAFEGO_API_FALLBACK"; do
            echo "Testando API: $CANDIDATE"
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 45 \
              --retry 4 --retry-delay 3 --retry-all-errors \
              -H 'User-Agent: acidentes-pe-github-backup/1.0' \
              -o /tmp/observatrafego_response.json \
              "$CANDIDATE"; then
              if python - <<'PY'
          import json
          with open('/tmp/observatrafego_response.json', encoding='utf-8') as f:
              payload = json.load(f)
          if isinstance(payload, list):
              ok = True
          elif isinstance(payload, dict) and isinstance(payload.get('records'), list):
              ok = True
          else:
              ok = False
          print(f'Formato JSON aceito: {ok}')
          raise SystemExit(0 if ok else 1)
          PY
              URL="$CANDIDATE"
              break
            fi
            echo "Endpoint indisponível: $CANDIDATE"
          done

          if [ -z "$URL" ]; then
            echo "ERRO: nenhum endpoint do ObservaTrafego respondeu com JSON válido."
            exit 1
          fi

          echo "Endpoint selecionado: $URL"
          python scripts/backup_observatrafego_to_sql.py \
            --url "$URL" \
            --day "$DAY" \
            --output "$OUTPUT"

          cp "$OUTPUT" "dumps/observatrafego/observatrafego_latest.sql"

      - name: Commit somente se houver alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dumps/observatrafego/*.sql
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos registros do dia."
            exit 0
          fi
          git commit -m "chore: atualiza dump ObservaTrafego $(TZ=America/Recife date +%F)"
          git push
