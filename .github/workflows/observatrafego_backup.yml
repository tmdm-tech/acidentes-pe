name: Dump automático ObservaTrafego

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/observatrafego_backup.yml"
      - "scripts/backup_observatrafego_to_sql.py"
      - "scripts/observatrafego_full_snapshot.py"

permissions:
  contents: write

env:
  OBSERVATRAFEGO_API_PRIMARY: "https://observatrafego.saude.pe.gov.br/api/accidents"
  OBSERVATRAFEGO_API_FALLBACK: "https://observatrafego-jx4p.onrender.com/api/accidents"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Coletar API com redundância
        shell: bash
        run: |
          set -euo pipefail
          URL=""
          for CANDIDATE in "$OBSERVATRAFEGO_API_PRIMARY" "$OBSERVATRAFEGO_API_FALLBACK"; do
            echo "Testando API: $CANDIDATE"
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 45 \
              --retry 5 --retry-delay 3 --retry-all-errors \
              -H 'User-Agent: acidentes-pe-github-backup/1.0' \
              -o /tmp/observatrafego_response.json "$CANDIDATE"; then
              python - <<'PY'
          import json
          with open('/tmp/observatrafego_response.json', encoding='utf-8') as f:
              payload=json.load(f)
          ok=isinstance(payload,list) or (isinstance(payload,dict) and isinstance(payload.get('records'),list))
          print(f'JSON válido: {ok}')
          raise SystemExit(0 if ok else 1)
          PY
              URL="$CANDIDATE"
              break
            fi
            echo "Endpoint indisponível: $CANDIDATE"
          done
          if [ -z "$URL" ]; then
            echo "ERRO: nenhum endpoint respondeu com JSON válido."
            exit 1
          fi
          echo "Endpoint selecionado: $URL"
          cp /tmp/observatrafego_response.json dumps/observatrafego/.latest_response.json

      - name: Gerar candidato de snapshot completo
        run: |
          python scripts/observatrafego_full_snapshot.py \
            --input dumps/observatrafego/.latest_response.json \
            --output dumps/observatrafego/.observatrafego_latest_candidate.sql

      - name: Bloquear substituição se houver redução de registros
        shell: bash
        run: |
          set -euo pipefail
          NEW_COUNT=$(grep -c '^INSERT INTO "acidentes_observatrafego_snapshot"' dumps/observatrafego/.observatrafego_latest_candidate.sql || true)
          OLD_COUNT=0
          if [ -f dumps/observatrafego/observatrafego_latest.sql ]; then
            OLD_COUNT=$(grep -c '^INSERT INTO "acidentes_observatrafego_snapshot"' dumps/observatrafego/observatrafego_latest.sql || true)
          fi
          echo "Snapshot anterior: $OLD_COUNT registros"
          echo "Snapshot novo: $NEW_COUNT registros"
          if [ "$NEW_COUNT" -lt 1 ]; then
            echo "ERRO: coleta sem registros. Snapshot anterior será preservado."
            exit 1
          fi
          if [ "$OLD_COUNT" -gt 0 ] && [ "$NEW_COUNT" -lt "$OLD_COUNT" ]; then
            echo "ERRO: nova coleta tem menos registros que o snapshot anterior."
            echo "Nenhum arquivo anterior será substituído para evitar perda de dados."
            exit 1
          fi
          mv dumps/observatrafego/.observatrafego_latest_candidate.sql dumps/observatrafego/observatrafego_latest.sql

      - name: Gerar dump diário da mesma coleta
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=America/Recife date +%F)"
          python scripts/backup_observatrafego_to_sql.py \
            --input dumps/observatrafego/.latest_response.json \
            --day "$DAY" \
            --output "dumps/observatrafego/.observatrafego_${DAY}_candidate.sql"
          NEW_DAY=$(grep -c '^INSERT INTO' "dumps/observatrafego/.observatrafego_${DAY}_candidate.sql" || true)
          OLD_DAY=0
          if [ -f "dumps/observatrafego/observatrafego_${DAY}.sql" ]; then
            OLD_DAY=$(grep -c '^INSERT INTO' "dumps/observatrafego/observatrafego_${DAY}.sql" || true)
          fi
          echo "Dump diário anterior: $OLD_DAY"
          echo "Dump diário novo: $NEW_DAY"
          if [ "$NEW_DAY" -ge "$OLD_DAY" ]; then
            mv "dumps/observatrafego/.observatrafego_${DAY}_candidate.sql" "dumps/observatrafego/observatrafego_${DAY}.sql"
          else
            echo "Coleta diária menor que a anterior; preservando versão anterior."
            rm -f "dumps/observatrafego/.observatrafego_${DAY}_candidate.sql"
          fi

      - name: Remover resposta temporária
        run: rm -f dumps/observatrafego/.latest_response.json

      - name: Validar integridade antes do commit
        shell: bash
        run: |
          set -euo pipefail
          test -s dumps/observatrafego/observatrafego_latest.sql
          grep -q 'CREATE TABLE "acidentes_observatrafego_snapshot"' dumps/observatrafego/observatrafego_latest.sql
          COUNT=$(grep -c '^INSERT INTO "acidentes_observatrafego_snapshot"' dumps/observatrafego/observatrafego_latest.sql || true)
          echo "INSERTs preservados no snapshot: $COUNT"
          if [ "$COUNT" -lt 1 ]; then exit 1; fi

      - name: Commit somente se houver alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dumps/observatrafego/*.sql
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos registros."
            exit 0
          fi
          git commit -m "chore: atualiza backup ObservaTrafego $(TZ=America/Recife date +%F-%H%M)"
          git push
